<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Feedback</title>
    <style>
        body { 
			font-family: Arial;
			 display: flex;
			  justify-content: center; 
			  
			  align-items: center;
			   height: 100vh;
			    background-color: #f4f4f4; 
			}
        .view-card { 
			background: white;
			 padding: 30px; 
			 border-radius: 12px;
			  box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
			  width: 400px; }
        .label { 
			font-weight: bold; 
			
			
			color: #555; 
		}
        .content { 
			margin-bottom: 20px; 
			font-size: 18px; 
			color: #222; 
		}
        .back-btn { 
			display: inline-block; 
			padding: 10px 15px; 
			background-color: rgb(128, 128, 128); 
			color: white; 
			text-decoration: none;
			 border-radius: 5px;
		  }
    </style>
</head>
<body>
    <div class="view-card">
        <h2>Feedback Details</h2>
        <hr>
        <p class="label">Feedback ID:</p>
        <p class="content" th:text="${feedback.id}">1</p>

        <p class="label">Message:</p>
        <p class="content" th:text="${feedback.feedbackText}">Sample text here...</p>

        <p class="label">Submitted On:</p>
        <p class="content" th:text="${feedback.date}">2026-02-13</p>

        <a th:href="@{/api/feedback/admin}" class="back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
