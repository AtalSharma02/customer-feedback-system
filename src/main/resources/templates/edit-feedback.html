<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Feedback</title>
    <style>
        body { font-family: Arial; 
			display: flex; 
			justify-content: center; 
			align-items: center; 
			height: 100vh; 
			background-color: #f4f4f4; }
        .edit-card { 
			background: white; 
			padding: 25px;
			 border-radius: 10px;
			  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
			   width: 350px; text-align: center;
		    }
        textarea { 
			width: 100%;
			 height: 100px; 
			 margin-bottom: 15px;
			  padding: 10px; 
		  }
        button { 
			background-color: rgb(128, 128, 128); 
			color: white; 
			border: none;
			 padding: 10px 20px; 
			 border-radius: 5px; 
			 cursor: pointer; }
    </style>
</head>
<body>
    <div class="edit-card">
        <h2>Edit Your Feedback</h2>
        <form th:action="@{/api/feedback/update}" method="post">
            <input type="hidden" name="id" th:value="${feedback.id}">
            
            <textarea name="feedbackText" th:text="${feedback.feedbackText}" required></textarea>
            <br>
            <button type="submit">Update Feedback</button>
        </form>
    </div>
</body>
</html>
